# =============================================================================
# Template de server block Nginx POUR L'HÔTE (reverse proxy vers le conteneur).
# Équivalent du vhost Apache (docker/apache/vhost-host/). Générique : aucun
# domaine en dur.
#
#   Internet --HTTPS:443--> Nginx hôte --HTTP--> conteneur CSWeb (127.0.0.1:PORT)
#
# Placeholders à remplacer :
#   {{DOMAIN}}     ex. csweb.example.org
#   {{APP_PORT}}   port hôte mappé du conteneur (CSWEB_PORT du .env, ex. 8095)
#
# Installation :
#   sed -e 's/{{DOMAIN}}/csweb.example.org/g' -e 's/{{APP_PORT}}/8095/g' \
#       csweb.nginx.template.conf | sudo tee /etc/nginx/sites-available/csweb.conf
#   sudo ln -s /etc/nginx/sites-available/csweb.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d {{DOMAIN}}      # injecte les directives ssl_*
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT
#   - Ne PAS ouvrir {{APP_PORT}} sur le firewall : seuls 80 et 443. Le proxy
#     accède au conteneur en local via 127.0.0.1.
#   - X-Forwarded-Proto/-Port reflètent le protocole vu par le CLIENT. Le bloc
#     :443 DOIT donc annoncer "https"/"443", sinon l'app génère des URLs http://
#     bloquées en mixed content. Côté app, app.php fait confiance au proxy
#     (setTrustedProxies) pour lire ces en-têtes — identique au cas Apache.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};
    # Redirige tout le HTTP vers HTTPS (Certbot pose une règle similaire).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{DOMAIN}};

    # --- Certificats : injectés par `certbot --nginx`, ou à renseigner ici ---
    # ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # Uploads de dictionnaires / données : autoriser des corps de requête larges
    # (aligné sur PHP_UPLOAD_MAX_FILESIZE / PHP_POST_MAX_SIZE du .env, ex. 100M).
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        # Le client est en HTTPS → l'app doit le savoir (URLs https, cookies secure).
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/csweb_access.log;
    error_log  /var/log/nginx/csweb_error.log;
}
