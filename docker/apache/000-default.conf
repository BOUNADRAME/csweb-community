# ============================================================================
# CSWeb Community Platform - Apache VirtualHost (envsubst template)
# ============================================================================
# Variables are substituted at container startup via docker-entrypoint.sh

Timeout ${APACHE_TIMEOUT}
KeepAlive On
KeepAliveTimeout ${APACHE_KEEP_ALIVE_TIMEOUT}
MaxKeepAliveRequests ${APACHE_MAX_KEEP_ALIVE_REQUESTS}

<VirtualHost *:80>
    ServerAdmin admin@csweb.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Enable URL rewriting
        RewriteEngine On

        # Redirect to setup if config.php doesn't exist (exclude static assets)
        RewriteCond %{REQUEST_URI} !^/setup
        RewriteCond %{REQUEST_URI} !^/bower_components
        RewriteCond %{REQUEST_URI} !^/dist
        RewriteCond %{REQUEST_URI} !^/js
        RewriteCond %{REQUEST_URI} !^/less
        RewriteCond %{DOCUMENT_ROOT}/src/AppBundle/config.php !-f
        RewriteRule ^(.*)$ /setup/ [R=302,L]
    </Directory>

    # Logs. File paths (/api/files/..., /file-manager/...) are masked: CSPro
    # media names often contain the respondent's case key. The Referer is
    # left out for the same reason.
    SetEnvIf Request_URI "^/(api/files|file-manager)(/|$)" csweb_private_path
    LogFormat "%h %l %u %t \"%r\" %>s %O \"%{User-Agent}i\"" csweb_public
    LogFormat "%h %l %u %t \"%m [path masked] %H\" %>s %O \"%{User-Agent}i\"" csweb_masked
    ErrorLog ${APACHE_LOG_DIR}/csweb-error.log
    CustomLog ${APACHE_LOG_DIR}/csweb-access.log csweb_public env=!csweb_private_path
    CustomLog ${APACHE_LOG_DIR}/csweb-access.log csweb_masked env=csweb_private_path

    # PHP configuration
    php_value upload_max_filesize ${PHP_UPLOAD_MAX_FILESIZE}
    php_value post_max_size ${PHP_POST_MAX_SIZE}
    php_value max_execution_time ${PHP_MAX_EXECUTION_TIME}
    php_value memory_limit ${PHP_MEMORY_LIMIT}
</VirtualHost>
