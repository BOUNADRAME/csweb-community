# =============================================================================
# Template de vhost Apache POUR L'HÔTE (reverse proxy vers le conteneur CSWeb).
# Générique : aucun domaine en dur. Remplacer les placeholders et déployer.
#
#   Internet --HTTPS:443--> Apache hôte --HTTP--> conteneur CSWeb (127.0.0.1:PORT)
#
# Placeholders à remplacer :
#   {{DOMAIN}}     ex. csweb.example.org
#   {{APP_PORT}}   port hôte mappé du conteneur (CSWEB_PORT du .env, ex. 8095)
#
# Installation :
#   sed -e 's/{{DOMAIN}}/csweb.example.org/g' -e 's/{{APP_PORT}}/8095/g' \
#       csweb.vhost.template.conf | sudo tee /etc/apache2/sites-available/csweb.conf
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo a2ensite csweb.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d {{DOMAIN}}      # génère/complète le bloc :443
#
# IMPORTANT
#   - Ne PAS ouvrir {{APP_PORT}} sur le firewall : seuls 80 et 443. Le proxy
#     accède au conteneur en local via 127.0.0.1.
#   - X-Forwarded-Proto/-Port indiquent le protocole vu par le CLIENT. Le bloc
#     :443 DOIT donc annoncer "https"/"443" (et non http/80), sinon l'app génère
#     des URLs http:// bloquées en mixed content. Côté app, app.php fait
#     confiance au proxy (setTrustedProxies) pour lire ces en-têtes.
# =============================================================================

<VirtualHost *:80>
    ServerName {{DOMAIN}}
    DocumentRoot /var/www/html

    # Redirige tout le trafic HTTP vers HTTPS (Certbot pose une règle similaire).
    RewriteEngine On
    RewriteCond %{SERVER_NAME} ={{DOMAIN}}
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName {{DOMAIN}}
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:{{APP_PORT}}/
    ProxyPassReverse / http://127.0.0.1:{{APP_PORT}}/

    # Le client est en HTTPS → l'app doit le savoir pour générer des URLs https.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ErrorLog  ${APACHE_LOG_DIR}/csweb_error.log
    CustomLog ${APACHE_LOG_DIR}/csweb_access.log combined

    # --- Lignes ajoutées automatiquement par Certbot (ne pas recopier à la main) ---
    # SSLCertificateFile    /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem
    # Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
